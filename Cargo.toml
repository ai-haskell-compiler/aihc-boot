[workspace]
resolver = "2"
members = ["crates/aihc-syntax", "crates/aihc-resolve", "crates/aihc-boot"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/ai-haskell-compiler/aihc-boot"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# The parser reads a lot of characters one at a time. These lints add noise
# without a gain in clarity.
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

[profile.release]
debug = 1
