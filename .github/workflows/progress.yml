name: Progress

# Re-measures milestone progress and commits README.md / progress/history.csv
# when anything changed. No human intervention needed.
on:
  schedule:
    - cron: "17 3 * * *" # daily, 03:17 UTC
  workflow_dispatch:

# The ruleset on main requires a pull request for each change, and a ruleset
# cannot bypass GITHUB_TOKEN. The workflow pushes with a deploy key that is
# in the bypass list of the ruleset. The secret PROGRESS_DEPLOY_KEY holds the
# private key. See docs/PLAN.md, "Tooling".
permissions:
  contents: read

concurrency:
  group: progress
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ssh-key: ${{ secrets.PROGRESS_DEPLOY_KEY }}
      - uses: cachix/install-nix-action@v31
      # Build the boot compiler here once it exists, so M3-M7 are measured
      # (boot.toml expects it at target/release/aihc-boot), e.g.:
      # - run: nix develop --command cargo build --release
      - name: Measure progress
        run: nix develop .#tracker --command python3 scripts/progress.py --write
      - name: Commit if changed
        run: |
          if git diff --quiet -- README.md progress/; then
            echo "No change in progress."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md progress/
          git commit -m "chore(progress): update progress"
          git push
